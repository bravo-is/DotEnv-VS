name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run parser, selection, migration, and context tests
        run: dotnet run --project tests/Tests.csproj -c Release
      - name: Build VSIX
        shell: pwsh
        run: ./Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DotEnvForVisualStudio
          path: |
            dist/DotEnvForVisualStudio-*.vsix
            dist/DotEnvForVisualStudio-*.vsix.sha256
          if-no-files-found: error
